<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passed Recordings EML Campaign Generator v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:1200px;margin:20px auto;padding:20px}
textarea,input{width:100%;box-sizing:border-box;padding:8px;margin:6px 0 12px}
button{padding:10px 16px;margin-right:8px}
.section{border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#status{font-weight:bold}
</style>
</head>
<body>
<h1>Passed Recordings EML Campaign Generator v2</h1>

<div class='section'>
<h2>Campaign Details</h2>
<input id='artist' placeholder='Artist Name'>
<input id='release' placeholder='Release Name'>
<input id='releaseDate' placeholder='Release Date (e.g. 25th December 2026)'>
<textarea id='description'>Release description - go as long or short a you like!</textarea>
<input id='recommended' placeholder='Recommended for fans of...'>
<input id='subject' value='Review copy: {{release}} by {{artist}}'>
</div>

<div class='section'>
<h2>Campaign Image</h2>
<p>Optional — the image will be embedded immediately before “Thank you for your time”.</p>
<input id='imageUpload' type='file' accept='image/png,image/jpeg,image/gif,image/webp'>
<button id='clearImageBtn' type='button'>Clear Image</button>
<div id='imageStatus'>No image selected.</div>
</div>

<div class='grid'>
<div class='section'>
<h2>Recipients CSV</h2>
<p>Columns: Name,Show,Email</p>
<textarea id='csv' rows='12'>Name,Show,Email
John Smith,Ambient Airwaves,john@example.com
Sarah Jones,Drone Frequency,sarah@example.com</textarea>
</div>

<div class='section'>
<h2>Bandcamp Codes</h2>
<p>One code per line</p>
<textarea id='codes' rows='12'>ABC123
DEF456
GHI789</textarea>
</div>
</div>

<div class='section'>
<button id='previewBtn'>Preview First Email</button>
<button id='zipBtn'>Generate ZIP</button>
<div id='status'></div>
</div>

<div class='section'>
<h2>Preview</h2>
<textarea id='preview' rows='16'></textarea>
</div>

<script>
let uploadedImage=null;

imageUpload.onchange=()=>{
 const file=imageUpload.files[0];
 if(!file){uploadedImage=null;imageStatus.textContent='No image selected.';return;}
 if(!['image/png','image/jpeg','image/gif','image/webp'].includes(file.type)){
  uploadedImage=null;imageUpload.value='';imageStatus.textContent='Please select a PNG, JPEG, GIF, or WebP image.';return;
 }
 if(file.size>5*1024*1024){
  uploadedImage=null;imageUpload.value='';imageStatus.textContent='Image must be 5 MB or smaller.';return;
 }
 const reader=new FileReader();
 reader.onload=()=>{
  uploadedImage={mime:file.type,base64:reader.result.split(',')[1]};
  imageStatus.textContent=`Selected: ${file.name}`;
 };
 reader.onerror=()=>{uploadedImage=null;imageStatus.textContent='Could not read the selected image.';};
 reader.readAsDataURL(file);
};

clearImageBtn.onclick=()=>{
 uploadedImage=null;
 imageUpload.value='';
 imageStatus.textContent='No image selected.';
};

function parseRecipients(t){
 const lines=t.trim().split(/\r?\n/).slice(1);
 return lines.map(l=>{
 const c=l.split(',');
 return {name:(c[0]||'').trim(),show:(c[1]||'').trim(),email:(c[2]||'').trim()};
 }).filter(r=>r.email);
}
function parseCodes(t){return t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);}
function subjectFor(r){return document.getElementById('subject').value.replaceAll('{{artist}}',artist.value).replaceAll('{{release}}',release.value).replaceAll('{{show}}',r.show).replaceAll('{{name}}',r.name);}
function escapeHtml(text){
 return text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])).replace(/\n/g,'<br>\n');
}
function encodeBase64Utf8(text){
 const bytes=new TextEncoder().encode(text);
 let binary='';
 for(let i=0;i<bytes.length;i+=8192) binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
 return btoa(binary).replace(/(.{76})/g,'$1\r\n');
}
function wrapBase64(value){return value.replace(/(.{76})/g,'$1\r\n').replace(/\r\n$/,'');}
function buildEML(r,code){
const body=`Hi ${r.name},\n\nI hope this message finds you well.\n\nI'm ${artist.value} from Passed Recordings. I know you are really busy and already receive tons of requests like this, but I'd love to share a promo copy of ${release.value} with ${r.show}.\n\n${release.value} (Release Date: ${releaseDate.value}) is ${description.value}.\n\nRecommended for fans of ${recommended.value}.\n\nRedeem here:\nhttps://passedrecordings.bandcamp.com/yum?code=${code}\n\nCode: ${code}\n\nThank you for your time.\n\n${artist.value} // Passed Recordings // Absolute Atmosphere 🕊️`;
 if(!uploadedImage){
  return `To: ${r.email}\nSubject: ${subjectFor(r)}\nMIME-Version: 1.0\nContent-Type: text/plain; charset=utf-8\nX-Unsent: 1\n\n${body}`;
 }
 const mixed='----=_PassedRecordings_Mixed_8A4B2C';
 const alt='----=_PassedRecordings_Alt_8A4B2C';
 const html=escapeHtml(body).replace('Thank you for your time.','<img src="cid:campaign-image" alt="Campaign image" style="max-width:50%;height:auto"><br><br>Thank you for your time.');
 return `To: ${r.email}\nSubject: ${subjectFor(r)}\nMIME-Version: 1.0\nX-Unsent: 1\nContent-Type: multipart/related; boundary="${mixed}"; type="multipart/alternative"\n\n--${mixed}\nContent-Type: multipart/alternative; boundary="${alt}"\n\n--${alt}\nContent-Type: text/plain; charset=utf-8\nContent-Transfer-Encoding: 8bit\n\n${body}\n\n--${alt}\nContent-Type: text/html; charset=utf-8\nContent-Transfer-Encoding: base64\n\n${encodeBase64Utf8(`<!doctype html><html><body>${html}</body></html>`)}\n\n--${alt}--\n\n--${mixed}\nContent-Type: ${uploadedImage.mime}; name="campaign-image"\nContent-Transfer-Encoding: base64\nContent-ID: <campaign-image>\nContent-Disposition: inline; filename="campaign-image"\n\n${wrapBase64(uploadedImage.base64)}\n\n--${mixed}--`;
}
previewBtn.onclick=()=>{
 const r=parseRecipients(csv.value)[0];
 const code=parseCodes(codes.value)[0];
 if(r&&code) preview.value=buildEML(r,code);
};
zipBtn.onclick=async()=>{
 const rec=parseRecipients(csv.value);
 const codeList=parseCodes(codes.value);
 if(codeList.length<rec.length){status.textContent=`Not enough codes. Need ${rec.length}, have ${codeList.length}.`;return;}
 const zip=new JSZip();
 let report='Name,Show,Email,AssignedCode\n';
 rec.forEach((r,i)=>{
 const code=codeList[i];
 const safe=r.name.replace(/[^a-z0-9]/gi,'_');
 zip.file(`${safe}.eml`,buildEML(r,code));
 report+=`${r.name},${r.show},${r.email},${code}\n`;
 });
 zip.file('code-assignment-report.csv',report);
 const unused=codeList.slice(rec.length);
 if(unused.length) zip.file('unused-codes.txt',unused.join('\n'));
 status.textContent=`${rec.length} emails generated. ${unused.length} unused codes.`;
 const blob=await zip.generateAsync({type:'blob'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='PassedRecordingsCampaign.zip';
 a.click();
 };
</script>
</body>
</html>
